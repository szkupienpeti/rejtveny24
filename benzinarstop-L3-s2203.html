<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Jelszóval védett demó</title>
<!-- Sablon: a tools/web.py tölti ki. A valódi oldal AES-GCM-mel titkosítva van benne (kulcs: PBKDF2-SHA256 a jelszóból),
     a böngésző a beírt jelszóval helyben fejti vissza. Szándékosan semleges megjelenés, márkaelemek nélkül. -->
<style>
  :root { --ink: #1d2633; --muted: #6b6b76; --line: #cdd3dc; --accent: #002e5e; --err: #b3261e; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
         background: #f4f5f7; color: var(--ink); font: 400 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  form { width: min(360px, 100%); background: #fff; padding: 28px 26px 24px; box-shadow: 0 2px 14px rgba(0,0,0,.08); }
  h1 { font-size: 19px; margin: 0 0 6px; }
  p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
  input[type=password] { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--line); outline: none; }
  input[type=password]:focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  label { display: flex; align-items: center; gap: 8px; margin: 12px 0 18px; font-size: 13px; color: var(--muted); }
  button { width: 100%; font: 600 14px/1 system-ui, sans-serif; padding: 12px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .err { color: var(--err); font-size: 13px; min-height: 20px; margin: 10px 0 0; }
</style>
</head>

  <p>Az oldal megtekintéséhez add meg a kapott jelszót.</p>

  <label><input type="checkbox" id="remember" checked> Jelszó megjegyzése ezen az eszközön</label>
  <button id="go">Belépés</button>
  <div class="err" id="err" role="alert"></div>
</form>

const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const KEY = "rejtveny24-kulcs-" + P.salt;   // a buildenkénti só miatt új jelszónál a régi kulcs nem érvényes
const store = (st, v) => { try { v == null ? st.removeItem(KEY) : st.setItem(KEY, v); } catch {} };
const stored = () => { try { return sessionStorage.getItem(KEY) || localStorage.getItem(KEY); } catch { return null; } };

async function derive(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(P.salt), iterations: P.iter, hash: "SHA-256" },
                                 base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
async function open(key) {
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.iv) }, key, b64(P.ct));
  const raw = btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey("raw", key))));
  return [new TextDecoder().decode(plain), raw];
}
// a document.open() csak a betöltés után cseréli le a teljes dokumentumot (közben a régi folyamba írna)
function show(html) {
  const swap = () => setTimeout(() => { document.open(); document.write(html); document.close(); });
  document.readyState === "complete" ? swap() : addEventListener("load", swap, { once: true });
}

(async () => {
  const k = stored();
  if (!k) return;
  try {
    const key = await crypto.subtle.importKey("raw", b64(k), "AES-GCM", true, ["decrypt"]);
    show((await open(key))[0]);
  } catch { store(sessionStorage, null); store(localStorage, null); }
})();

document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const go = document.getElementById("go"), err = document.getElementById("err");
  if (!window.crypto || !crypto.subtle) { err.textContent = "Ez a böngésző nem támogatja a visszafejtést (https szükséges)."; return; }
  go.disabled = true; err.textContent = "";
  try {
    const [html, raw] = await open(await derive(document.getElementById("pw").value));
    store(sessionStorage, raw);
    if (document.getElementById("remember").checked) store(localStorage, raw);
    show(html);
  } catch {
    err.textContent = "Hibás jelszó.";
    go.disabled = false;
  }
});
})();
